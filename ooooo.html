    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f7f8fc 0%, #eef2ff 100%);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .card {
            background: #ffffff;
            width: 90%;
            max-width: 480px;
            padding: 48px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
        }
        /* Loading旋转动画 */
        .loader {
            width: 56px;
            height: 56px;
            border: 4px solid #e6edff;
            border-top-color: #3671e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to {transform: rotate(360deg);}
        }
        h2 {
            font-size: 24px;
            color: #1d2939;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 15px;
            color: #667085;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .error-text {
            font-size: 18px;
            color: #d92d20;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            padding: 14px 36px;
            background-color: #3671e9;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.25s ease;
        }
        .btn-link:hover {
            background-color: #2859c4;
        }
        .tip-small {
            margin-top: 16px;
            font-size: 13px;
            color: #98a2b3;
        }
    </style>
</head>
